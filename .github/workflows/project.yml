name: Kagenti Project Automation

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  contents: read

jobs:
  add:
    name: Add item to Kagenti Project

    permissions:
      issues: write
      pull-requests: write
      contents: read

    # SHA-pinned to a specific rossoctl/.github commit (not @main) for supply-chain safety.
    uses: rossoctl/.github/.github/workflows/add-to-project.yml@2610c7817f0acb847f83038fe7c4718112cf94d8 # 2026-07-20
    secrets: inherit

